<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Third Age Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%2314171c'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23c9a227'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>The Third Age <span class="subtitle">Tracker</span></h1>
  <nav class="tabs" id="mainTabs">
    <button class="tab-btn active" data-tab="skills">Skills</button>
    <button class="tab-btn" data-tab="party">Party</button>
    <button class="tab-btn" data-tab="boss">Boss Fight</button>
  </nav>
</header>

<main id="app">

  <section id="skillsView" class="view active">
    <div class="char-picker" id="charPicker"></div>
    <div id="charContent"></div>
  </section>

  <section id="partyView" class="view">
    <p class="party-hint">Pick up to 3 characters to bring into the party for quick skill use in combat.</p>
    <div class="char-picker party-picker" id="partyPicker"></div>
    <div id="partyContent"></div>
  </section>

  <section id="bossView" class="view">
    <div class="boss-panel">
      <div class="boss-setup card">
        <label>
          Boss Health
          <input type="number" id="bossMaxHealth" min="0" placeholder="e.g. 5000">
        </label>
        <button id="newBossBtn" class="btn btn-secondary">New Boss</button>
      </div>

      <div class="boss-stats card">
        <div class="stat"><span class="stat-label">HP Left</span><span class="stat-value" id="statHpLeft">-</span></div>
        <div class="stat"><span class="stat-label">% Left</span><span class="stat-value" id="statPctLeft">-</span></div>
        <div class="stat"><span class="stat-label">Average Hit</span><span class="stat-value" id="statAvgHit">-</span></div>
        <div class="stat"><span class="stat-label">Est. Hits Left</span><span class="stat-value" id="statHitsLeft">-</span></div>
      </div>

      <div class="boss-add card">
        <form id="hitForm">
          <input type="number" id="hitInput" placeholder="Hit damage" inputmode="numeric" autocomplete="off">
          <button type="submit" class="btn btn-primary">Add Hit</button>
        </form>
        <button id="undoHitBtn" class="btn btn-secondary" disabled>Undo Last Hit</button>
      </div>

      <div class="boss-log card">
        <h3>Hit Log (<span id="hitCount">0</span>)</h3>
        <ul id="hitList" class="hit-list"></ul>
      </div>
    </div>
  </section>

</main>

<script src="js/data.js"></script>
<script src="js/equipment.js"></script>
<script src="js/app.js"></script>
</body>
</html>
